name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A fine-grained PAT is required because the org policy
      # "Allow GitHub Actions to create and approve pull requests" is disabled
      # by default. RELEASE_PLEASE_TOKEN (Contents R/W + PRs R/W) bypasses
      # that restriction.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
